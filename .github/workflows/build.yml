name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup devkitPro (pacman)
        run: |
          sudo dkp-pacman-key --init 2>/dev/null || true
          dkp-pacman -Syy --noconfirm --needed 3ds-dev general-tools || \
          (sleep 5; dkp-pacman -Syy --noconfirm --needed 3ds-dev general-tools)
        shell: bash
        env:
          TERM: dumb

      - name: Install makerom and bannertool
        run: |
          apt-get update -qq && apt-get install -y -qq unzip wget >/dev/null 2>&1 || true
          wget -q https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip -O /tmp/makerom.zip
          unzip -o /tmp/makerom.zip -d /tmp/makerom_dl
          cp /tmp/makerom_dl/makerom /usr/local/bin/makerom
          chmod +x /usr/local/bin/makerom
          wget -q https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip -O /tmp/bannertool.zip
          unzip -o /tmp/bannertool.zip -d /tmp/bannertool_dl
          cp /tmp/bannertool_dl/linux-x86_64/bannertool /usr/local/bin/bannertool
          chmod +x /usr/local/bin/bannertool
          echo "--- tool check ---"
          makerom -version || true
          bannertool 2>&1 | head -3 || true
        shell: bash

      - name: Generate silent banner audio
        run: |
          python3 -c "import wave; w=wave.open('banner.wav','wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(22050); w.writeframes(b'\x00\x00'*22050); w.close()"
          ls -l banner.wav
        shell: bash

      - name: Build
        run: make -j$(nproc)
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: recroom3ds-build
          path: |
            recroom3ds.cia
            recroom3ds.3dsx
            recroom3ds.smdh
            recroom3ds.elf
            recroom3ds.bin
          if-no-files-found: warn
